# Aureum Voice stack (everything except the desktop app). Run from the repository root.
#
# Plan B / hosted mode — LiveKit Cloud for media, only the API reachable (on 127.0.0.1):
#   docker compose --env-file .env -f infra/docker-compose.yml up -d
#
# Fully local development — also runs LiveKit and publishes Postgres/Redis/MinIO on
# 127.0.0.1 so tests and Alembic can run from the host:
#   docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.dev.yml --profile local-livekit up -d
name: aureum-voice

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local media server, only for fully local development (plan B uses LiveKit Cloud).
  livekit:
    image: livekit/livekit-server:v1.13.10
    profiles: ["local-livekit"]
    restart: unless-stopped
    command:
      - --config=/etc/livekit.yaml
      - --dev
      - --node-ip=${LIVEKIT_NODE_IP:-127.0.0.1}
    environment:
      # Overrides the default dev key pair (devkey/secret).
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    ports:
      - "7880:7880"                # HTTP / WebSocket signaling
      - "7881:7881"                # ICE over TCP (fallback)
      - "50000-50100:50000-50100/udp"  # WebRTC media (kept small for Docker on Windows)
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7880 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Community fork: MinIO no longer publishes images (see docs/decisions/0001-minio-image.md).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ../apps/api
    restart: unless-stopped
    env_file: ../.env
    environment:
      # Inside the compose network the API reaches services by name and container port.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
    ports:
      # Localhost only: the public entry point is a reverse proxy (Tailscale Funnel now, Caddy later).
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres-data:
  redis-data:
  minio-data:
