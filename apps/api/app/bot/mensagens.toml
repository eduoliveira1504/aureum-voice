# Mensagens da @aureum. Edite à vontade: o texto entre chaves ({mencao}, {titulo}...) é
# preenchido pelo Aureum e precisa continuar igual. Depois de editar, reinicie a API.
#
# {mencao}      @usuario da pessoa (vira menção clicável)
# {canal_bugs}  o canal de bugs configurado (vira menção clicável)
# {quando}      data e hora, horário de Brasília
# {versao}      a versão nova do app (ex: 0.2.0-beta.4)
# {titulo}      o nome do evento ou do bug
# {local}       onde é o evento (" em #sala" ou " em Casa da Ana"; vazio se não tiver)
# Markdown simples funciona nas mensagens da @aureum: **negrito**, *itálico* e `código`.

[servidor]
boas_vindas = "⬢ {mencao} chegou! Pioneiro nº {numero} do Aureum. Seja bem-vindo(a)!"
boas_vindas_sem_pioneiro = "⬢ {mencao} chegou! Seja bem-vindo(a)!"
# Vai no fim das boas-vindas quando o canal de bugs está configurado.
boas_vindas_bugs = " Achou um bug? Manda no {canal_bugs}."
bug_confirmado = "🔧 **Bug encontrado:** {titulo}. Já estamos corrigindo. Valeu pelo aviso, {mencao}!"
bug_resolvido = "✅ **Bug corrigido:** {titulo}. Valeu, {mencao}! Atualizem o app e testem, por favor."
# Versão nova publicada no GitHub, no canal de avisos. As notas da versão vão logo abaixo.
versao_nova = "⬢ **Saiu a versão {versao} do Aureum!** O app se atualiza sozinho: é só fechar e abrir de novo."

[dm]
versao_nova = "⬢ **Saiu a versão {versao} do Aureum!** O app se atualiza sozinho: é só fechar e abrir de novo."
seguranca_senha = "**Sua senha foi alterada** em {quando}.\nNão foi você? Troque sua senha agora."
seguranca_email = "**O e-mail da sua conta foi alterado** para {novo} em {quando}.\nNão foi você? Troque sua senha agora."
seguranca_login = "**Novo login na sua conta** em {quando}, no {sistema}.\nNão foi você? Troque sua senha agora."
insignia = "Você ganhou a insígnia **{insignia}**!"
bug_confirmado = "Confirmamos o bug \"{titulo}\" que você reportou. Já estamos corrigindo e te avisamos aqui quando sair a correção."
bug_resolvido = "Seu bug \"{titulo}\" foi corrigido. Atualize o app e teste, por favor. Valeu!"
bug_resolvido_insignia = "Seu bug \"{titulo}\" foi corrigido. Atualize o app e teste, por favor. Valeu! E você ganhou a insígnia **{insignia}**."
convite = "{mencao} entrou com o seu convite!"
evento_dia = "📅 Falta 1 dia para **{titulo}**{local}."
evento_15min = "📅 **{titulo}** começa em 15 minutos{local}."
evento_comecou = "📅 **{titulo}** começou{local}!"
evento_alterado = "📅 **{titulo}** mudou de horário. Confira no evento."
evento_cancelado = "📅 **{titulo}** foi cancelado."
