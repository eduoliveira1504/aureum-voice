appId: com.aureum.voice
productName: Aureum Voice
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
# Updates (electron-updater) come from this public repository's GitHub releases, through the
# default latest.yml (no separate beta channel). `npm run release` creates the draft for the tag
# first and then uploads into it (GH_TOKEN from the root .env); it only reaches people once
# published on GitHub.
publish:
  provider: github
  owner: eduoliveira1504
  repo: aureum-voice
  releaseType: draft
